<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | Jolly AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-[#232f48] px-6 py-3 bg-white dark:bg-background-dark">
<div class="flex items-center gap-4 text-slate-900 dark:text-white">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Jolly AI</h2>
</div>
<div class="flex items-center gap-4">
<span class="text-sm text-slate-500 dark:text-slate-400 hidden sm:block">Already have an account?</span>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em]">
<span>Log in</span>
</button>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-4">
<div class="max-w-[480px] w-full bg-white dark:bg-[#192233] p-8 rounded-xl shadow-xl border border-slate-200 dark:border-[#324467]">
<!-- Headline Section -->
<div class="mb-8">
<h1 class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight text-center pb-2">Join Jolly AI</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal text-center">Start analyzing your legal agreements in seconds.</p>
</div>
<!-- Sign Up Form -->
<form class="space-y-5">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">Full Name</p>
<div class="relative">
<input class="form-input flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] h-12 placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] px-4 text-base" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-2">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">Email Address</p>
<div class="relative">
<input class="form-input flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] h-12 placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] px-4 text-base" placeholder="e.g. name@company.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">Password</p>
<div class="relative">
<input class="form-input flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] h-12 placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] px-4 text-base" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 cursor-pointer">visibility</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 px-1">Must be at least 8 characters long.</p>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-2">
<p class="text-slate-900 dark:text-white text-sm font-medium leading-normal">Confirm Password</p>
<div class="relative">
<input class="form-input flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] h-12 placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] px-4 text-base" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- TOS Checkbox -->
<div class="flex items-start gap-3 px-1 py-2">
<input class="mt-1 h-5 w-5 rounded border-slate-300 dark:border-[#324467] text-primary focus:ring-primary bg-slate-50 dark:bg-[#111722]" id="tos" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-300 leading-tight" for="tos">
                        I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Sign Up Button -->
<button class="w-full flex cursor-pointer items-center justify-center rounded-lg h-12 px-4 bg-primary text-white text-base font-bold leading-normal tracking-wide transition-all hover:bg-blue-700 active:scale-[0.98]" type="submit">
                    Create Account
                </button>
</form>
<!-- Social Sign up Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-slate-200 dark:border-[#324467]"></span>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-[#192233] px-2 text-slate-500 dark:text-slate-400">Or continue with</span>
</div>
</div>
<!-- Social Options -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-[#324467] py-2 px-4 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-[#232f48] transition-colors">
<img alt="Google" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCzSqYTiAUgsXecevmUeExkXyPoTMcq0YI0GO8oYcx9AGQDW3JfY-UDTjClVlmRoxmV5rin4xgcXxNgVKzX_nACZjhDBbJQ0SCu86uu_4TIjaZKrPhFzFzX5TZWA6gA7k3AimR_cW2L5AcEL6tDzRweeKa3LEHyLPg1CcEG6OVmG3CBL_fSex1A5bG2be-MnvBX8JOWItdL93qxzX9-8AOVEHtgZxaxxGa5D_hGlzBsWX8KgzI8CDl4tweM5H_nFUkeG-MQ50Dlx2k"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-[#324467] py-2 px-4 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-[#232f48] transition-colors">
<span class="material-symbols-outlined text-[20px]">corporate_fare</span>
                    SSO
                </button>
</div>
<!-- Mobile Login Link -->
<p class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400 sm:hidden">
                Already have an account? <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</main>
<!-- Background Decoration -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
</div>
<!-- Footer -->
<footer class="py-6 text-center text-slate-500 dark:text-slate-500 text-xs">
<p>© 2024 Jolly AI. All rights reserved.</p>
</footer>
</body></html>
