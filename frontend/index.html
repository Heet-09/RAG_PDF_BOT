<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF AI Chat</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com" rel="stylesheet">
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
  <!-- <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/> -->
  <!-- <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/> -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <h2 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]"><a href="home.html">Jolly LLB</a></h2>
      
    <div class="profile">
          <button class="logout-btn" onclick="logout()">Logout</button>
      <a href="profile.html">
  <img
    src="profile_icon.png"
    alt="Profile Icon"
    style="width:50px;height:50px;"
  >
</a>

    </div>

  </header>

  <!-- Main Chat Area -->
  <main class="chat-wrapper">
    <!-- Sidebar -->
    <aside class="conversation-list">
      <div class="sidebar-header">
        <h4>Your Chats</h4>
        <button class="new-chat-btn" onclick="startNewChat()">➕ New Chat</button>
      </div>

      <div id="conversationList"></div>
    </aside>


    <!-- Chat -->
    <section class="chat-section">
      <div class="active-user" id="activeUser"></div>

      <div id="chatContainer" class="chat-container">
        <div class="message assistant">
          Hi 👋  
          Upload a PDF and start asking questions from it.
        </div>
      </div>
    </section>
  </main>


  <footer class="chat-input-bar">

    <!-- PDF Selector -->
    <div class="pdf-select-box">
      <div class="pdf-select-header">
        📄 PDFs <span>Select up to 3</span>
      </div>
      <select id="pdfSelect" multiple></select>
    </div>

    <!-- Upload -->
    <div class="upload-inline">
      <input type="file" id="pdfUpload" hidden />
      <button onclick="document.getElementById('pdfUpload').click()">
        Choose PDF
      </button>
      <button class="upload-btn" onclick="uploadPDF()">Upload</button>
    </div>

    <!-- Chat Input -->
    <input
      type="text"
      id="question"
      placeholder="Ask something from the document…"
      onkeydown="if(event.key==='Enter') askQuestion()"
    />

    <button class="send-btn" onclick="askQuestion()">➤</button>

  </footer>

  <script src="script.js"></script>
  <script>
  if (!localStorage.getItem("user_id")) {
    window.location.href = "login.html";
  }
</script>

</body>
</html>
